name: Test CI/CD Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v6

      - name: installer nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  test-backend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven


        - name: Run backend tests
          working-directory: backend
          run: |
            ./mvnw -q -B -DskipTests package -Dmaven.test.skip=true



  buildpushfrontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: buildfrontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stock_frontend_prod:latest

  buildpushbackend:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stock_backend_prod:latest

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-file
          path: docker-compose.yml

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: docker-compose-file

      - name: Envoyer l'artefact via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/docker-compose.yml"
          target: "/home/ubuntu/stock_app/docker-compose.yml"

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            mkdir -p /home/ubuntu/stock_app
            cd /home/ubuntu/stock_app
            
            docker-compose -f /path/to/your/docker-compose.yml up -d